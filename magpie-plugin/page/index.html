<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgyMate 控制台</title>
<style>
  :root {
    color-scheme: light dark;
    --ag-bg: var(--magpie-bg, #f8fafc);
    --ag-fg: var(--magpie-fg, #0f172a);
    --ag-card: var(--magpie-card, #ffffff);
    --ag-line: var(--magpie-line, rgba(15, 23, 42, 0.1));
    --ag-muted: var(--magpie-muted, #64748b);
    --ag-accent: var(--magpie-accent, #0d9488);
    --ag-accent-fg: var(--magpie-accent-fg, #ffffff);
    --ag-accent-soft: var(--magpie-accent-soft, rgba(13, 148, 136, 0.12));
    --ag-radius: var(--magpie-radius, 14px);
    --ag-radius-sm: 8px;
    --ag-shadow: 0 12px 32px -10px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
    --ag-code-bg: rgba(15, 23, 42, 0.035);
    --ag-warn: #d97706;
    --ag-warn-soft: rgba(217, 119, 6, 0.12);
    --ag-ok: #059669;
    --ag-ok-soft: rgba(5, 150, 105, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ag-bg: var(--magpie-bg, #0b1117);
      --ag-fg: var(--magpie-fg, #e6edf3);
      --ag-card: var(--magpie-card, #121a23);
      --ag-line: var(--magpie-line, rgba(230, 237, 243, 0.11));
      --ag-muted: var(--magpie-muted, #8b9bb0);
      --ag-accent: var(--magpie-accent, #2dd4bf);
      --ag-accent-fg: var(--magpie-accent-fg, #042f2e);
      --ag-accent-soft: var(--magpie-accent-soft, rgba(45, 212, 191, 0.14));
      --ag-shadow: 0 18px 42px -12px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.28);
      --ag-code-bg: rgba(255, 255, 255, 0.04);
      --ag-warn: #fbbf24;
      --ag-warn-soft: rgba(251, 191, 36, 0.14);
      --ag-ok: #34d399;
      --ag-ok-soft: rgba(52, 211, 153, 0.16);
    }
  }

  :root[data-theme="dark"] {
    --ag-bg: var(--magpie-bg, #0b1117);
    --ag-fg: var(--magpie-fg, #e6edf3);
    --ag-card: var(--magpie-card, #121a23);
    --ag-line: var(--magpie-line, rgba(230, 237, 243, 0.11));
    --ag-muted: var(--magpie-muted, #8b9bb0);
    --ag-accent: var(--magpie-accent, #2dd4bf);
    --ag-accent-fg: var(--magpie-accent-fg, #042f2e);
    --ag-accent-soft: var(--magpie-accent-soft, rgba(45, 212, 191, 0.14));
    --ag-shadow: 0 18px 42px -12px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.28);
    --ag-code-bg: rgba(255, 255, 255, 0.04);
    --ag-warn: #fbbf24;
    --ag-warn-soft: rgba(251, 191, 36, 0.14);
    --ag-ok: #34d399;
    --ag-ok-soft: rgba(52, 211, 153, 0.16);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ag-bg);
    color: var(--ag-fg);
    font: 13px/1.55 var(--magpie-font, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
  }

  /* Silent initial probe: zero flash when Hub is already running */
  body[data-state="silent"] .card {
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 448px;
    background: var(--ag-card);
    border: 1px solid var(--ag-line);
    border-radius: var(--ag-radius);
    box-shadow: var(--ag-shadow);
    padding: 24px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #0f3d3e 0%, #0b1f29 100%);
    border: 1px solid rgba(94, 234, 212, 0.24);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .brand-mark svg {
    width: 28px;
    height: 28px;
    display: block;
  }

  .title-wrap {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .title {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--ag-fg);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 550;
    background: var(--ag-warn-soft);
    color: var(--ag-warn);
    white-space: nowrap;
  }

  body[data-state="probing"] .badge,
  body[data-state="retrying"] .badge {
    background: var(--ag-accent-soft);
    color: var(--ag-accent);
  }

  body[data-state="ready"] .badge {
    background: var(--ag-ok-soft);
    color: var(--ag-ok);
  }

  .dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.42; transform: scale(0.86); }
  }

  .addr {
    font: 11.5px/1.3 var(--magpie-code, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace);
    color: var(--ag-muted);
  }

  .status-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .said {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ag-fg);
  }

  .help-dot {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 999px;
    border: 1px solid var(--ag-line);
    background: var(--ag-code-bg);
    color: var(--ag-muted);
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
    flex-shrink: 0;
    cursor: help;
  }

  .help-dot:hover,
  .help-dot:focus-visible {
    color: var(--ag-accent);
    border-color: var(--ag-accent);
    background: var(--ag-accent-soft);
    outline: none;
  }

  .help-dot[data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 7px);
    transform: translateX(-50%) translateY(2px);
    width: max-content;
    max-width: min(260px, 76vw);
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--ag-line);
    background: var(--ag-card);
    color: var(--ag-fg);
    box-shadow: var(--ag-shadow);
    font-size: 11.5px;
    font-weight: 400;
    line-height: 1.45;
    white-space: normal;
    text-align: left;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
    z-index: 20;
  }

  .help-dot[data-tip]:hover::after,
  .help-dot[data-tip]:focus-visible::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .cmd-panel {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--ag-code-bg);
    border: 1px solid var(--ag-line);
  }

  .cmd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .cmd-code {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    font: 12px/1.5 var(--magpie-code, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace);
    color: var(--ag-fg);
    user-select: all;
    padding: 2px 0;
  }

  .copy-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--ag-line);
    background: var(--ag-card);
    color: var(--ag-fg);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .copy-btn:hover {
    border-color: var(--ag-muted);
  }

  .copy-btn[data-copied="true"] {
    border-color: transparent;
    background: var(--ag-ok-soft);
    color: var(--ag-ok);
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding-top: 2px;
  }

  .retry-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 15px;
    border: 0;
    border-radius: var(--ag-radius-sm);
    background: var(--ag-accent);
    color: var(--ag-accent-fg);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  .retry-btn:hover:not(:disabled) {
    opacity: 0.92;
  }

  .retry-btn:active:not(:disabled) {
    transform: scale(0.985);
  }

  .retry-btn:disabled {
    opacity: 0.68;
    cursor: default;
  }

  .retry-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  body[data-state="retrying"] .retry-icon,
  body[data-state="probing"] .retry-icon {
    animation: spin 0.85s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  body[data-state="probing"] .offline-only,
  body[data-state="ready"] .offline-only {
    display: none;
  }
</style>
</head>
<body data-state="silent">
  <main class="card" id="boot-card" role="status" aria-live="polite">
    <div class="head">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <ellipse cx="32" cy="34" rx="21" ry="10" transform="rotate(-22 32 34)" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2.6"/>
          <path d="M32 13L47 48H39.8L36.2 39.2H27.8L24.2 48H17L32 13ZM32 23.2L29.6 33.4H34.4L32 23.2Z" fill="#5eead4"/>
          <circle cx="48.5" cy="18.5" r="3.8" fill="#34d399"/>
        </svg>
      </div>
      <div class="title-wrap">
        <div class="title-row">
          <h1 class="title">AgyMate 控制台</h1>
          <span class="badge">
            <span class="dot" aria-hidden="true"></span>
            <span id="boot-badge-text">正在检测服务</span>
          </span>
        </div>
        <span class="addr" id="boot-addr">http://127.0.0.1:3778</span>
      </div>
    </div>

    <div class="status-box">
      <div class="said" id="said">正在连接本地 AgyMate Hub…</div>
      <button type="button" class="help-dot" id="boot-help" aria-label="连接说明" data-tip="每 2.5 秒自动检测，服务在线后自动进入控制台">?</button>
    </div>

    <div class="cmd-panel offline-only" id="boot-hint">
      <div class="cmd-row">
        <code class="cmd-code" id="boot-cmd">agymate service install &amp;&amp; agymate service restart</code>
        <button class="copy-btn" id="boot-copy" type="button" title="复制恢复命令">
          <span id="boot-copy-label">复制命令</span>
        </button>
      </div>
    </div>

    <div class="footer offline-only">
      <button class="retry-btn" id="boot-retry" type="button" title="每 2.5 秒自动重连">
        <svg class="retry-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="boot-retry-label">立即重连</span>
      </button>
    </div>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
