<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgyMate</title>
<style>
  :root {
    color-scheme: light dark;
    --notion-bg: #ffffff;
    --notion-bg-card: #ffffff;
    --notion-bg-recessed: #f6f5f4;
    --notion-ink: #37352f;
    --notion-ink-strong: rgba(0, 0, 0, 0.92);
    --notion-ink-muted: #78736f;
    --notion-border: rgba(55, 53, 47, 0.09);
    --notion-border-strong: #dfdcd9;
    --notion-blue-600: #0075de;
    --notion-blue-700: #005bab;
    --notion-blue-bg: #f2f9ff;
    --notion-blue-ink: #0075de;
    --notion-green-bg: #f0faf2;
    --notion-green-ink: #14832b;
    --notion-orange-bg: #fff5ed;
    --notion-orange-ink: #dd5b00;
    --notion-shadow-300: 0px 0.667px 3.502px 0px rgba(0, 0, 0, 0.01),
      0px 2.933px 7.252px 0px rgba(0, 0, 0, 0.016),
      0px 7.2px 14.462px 0px rgba(0, 0, 0, 0.02),
      0px 13.867px 28.348px 0px rgba(0, 0, 0, 0.026),
      0px 23.333px 52.123px 0px rgba(0, 0, 0, 0.035),
      0px 36px 89px 0px rgba(0, 0, 0, 0.045),
      0 0 0 1px rgba(55, 53, 47, 0.08);
    --notion-font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --notion-font-mono: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --notion-bg: #191919;
      --notion-bg-card: #262625;
      --notion-bg-recessed: #222221;
      --notion-ink: #e6e6e6;
      --notion-ink-strong: #ffffff;
      --notion-ink-muted: #8a8884;
      --notion-border: rgba(255, 255, 255, 0.09);
      --notion-border-strong: rgba(255, 255, 255, 0.16);
      --notion-blue-bg: rgba(0, 117, 222, 0.2);
      --notion-blue-ink: #62aef0;
      --notion-green-bg: rgba(20, 131, 43, 0.18);
      --notion-green-ink: #68ce7e;
      --notion-orange-bg: rgba(221, 91, 0, 0.18);
      --notion-orange-ink: #ffad71;
      --notion-shadow-300: 0 24px 64px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
  }

  :root[data-theme="dark"] {
    --notion-bg: #191919;
    --notion-bg-card: #262625;
    --notion-bg-recessed: #222221;
    --notion-ink: #e6e6e6;
    --notion-ink-strong: #ffffff;
    --notion-ink-muted: #8a8884;
    --notion-border: rgba(255, 255, 255, 0.09);
    --notion-border-strong: rgba(255, 255, 255, 0.16);
    --notion-blue-bg: rgba(0, 117, 222, 0.2);
    --notion-blue-ink: #62aef0;
    --notion-green-bg: rgba(20, 131, 43, 0.18);
    --notion-green-ink: #68ce7e;
    --notion-orange-bg: rgba(221, 91, 0, 0.18);
    --notion-orange-ink: #ffad71;
    --notion-shadow-300: 0 24px 64px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.12);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--notion-bg);
    color: var(--notion-ink);
    font: 13.5px/1.55 var(--notion-font-sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
  }

  body[data-state="silent"] .card {
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--notion-bg-card);
    border-radius: 12px;
    box-shadow: var(--notion-shadow-300);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 150ms cubic-bezier(0.16, 1, 0.3, 1), transform 150ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .head {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--notion-bg-recessed);
    color: var(--notion-ink-strong);
  }

  .brand-mark svg { width: 20px; height: 20px; display: block; }

  .title-wrap {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--notion-ink-strong);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11.5px;
    font-weight: 500;
    background: var(--notion-orange-bg);
    color: var(--notion-orange-ink);
    white-space: nowrap;
  }

  body[data-state="probing"] .badge,
  body[data-state="retrying"] .badge {
    background: var(--notion-blue-bg);
    color: var(--notion-blue-ink);
  }

  body[data-state="ready"] .badge {
    background: var(--notion-green-bg);
    color: var(--notion-green-ink);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .addr {
    font: 12px/1.3 var(--notion-font-mono);
    color: var(--notion-ink-muted);
  }

  .said {
    font-size: 13.5px;
    color: var(--notion-ink);
  }

  .cmd-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--notion-bg-recessed);
  }

  .cmd-code {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    font: 12px/1.5 var(--notion-font-mono);
    color: var(--notion-ink-strong);
    user-select: all;
  }

  .copy-btn {
    flex-shrink: 0;
    height: 26px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--notion-border-strong);
    background: var(--notion-bg-card);
    color: var(--notion-ink);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 75ms linear;
  }

  .copy-btn:hover { background: rgba(55, 53, 47, 0.05); }
  .copy-btn[data-copied="true"] {
    border-color: transparent;
    background: var(--notion-green-bg);
    color: var(--notion-green-ink);
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .retry-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 14px;
    border: 0;
    border-radius: 8px;
    background: var(--notion-blue-600);
    color: #ffffff;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms ease, transform 100ms ease-out;
  }

  .retry-btn:hover:not(:disabled) { background: var(--notion-blue-700); }
  .retry-btn:active:not(:disabled) { transform: scale(0.988); }
  .retry-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .retry-icon { width: 13px; height: 13px; flex-shrink: 0; }

  body[data-state="retrying"] .retry-icon,
  body[data-state="probing"] .retry-icon {
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  body[data-state="probing"] .offline-only,
  body[data-state="ready"] .offline-only { display: none; }
</style>
</head>
<body data-state="silent">
  <main class="card" id="boot-card" role="status" aria-live="polite">
    <div class="head">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="4" stroke="currentColor" stroke-width="1.75"/>
          <path d="M3.5 9.25H20.5M10.25 9.25V20.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/>
          <rect x="6" y="12.25" width="2" height="2" rx="0.6" fill="currentColor"/>
          <path d="M13.25 13.25H17.5M13.25 16.5H16.25" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title-wrap">
        <div class="title-row">
          <h1 class="title">AgyMate</h1>
          <span class="badge">
            <span class="dot" aria-hidden="true"></span>
            <span id="boot-badge-text">检测中</span>
          </span>
        </div>
        <span class="addr" id="boot-addr">http://127.0.0.1:3778</span>
      </div>
    </div>

    <div class="said" id="said">正在连接本地服务…</div>

    <div class="cmd-panel offline-only" id="boot-hint">
      <code class="cmd-code" id="boot-cmd">agymate service install &amp;&amp; agymate service restart</code>
      <button class="copy-btn" id="boot-copy" type="button">
        <span id="boot-copy-label">复制</span>
      </button>
    </div>

    <div class="footer offline-only">
      <button class="retry-btn" id="boot-retry" type="button">
        <svg class="retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
        </svg>
        <span id="boot-retry-label">重连</span>
      </button>
    </div>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
