name: Bug Report
description: Report a bug or unexpected behavior in AgyMate
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `agymate ...`
        2. Open ...
        3. See error
  - type: input
    id: os
    attributes:
      label: OS & Architecture
      placeholder: "macOS 15 arm64 / Ubuntu 24.04 amd64 / Windows 11 amd64"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted Doctor Output
      description: Please run `agymate doctor --redact --json` and paste the output (paths & emails are automatically redacted).
      render: json
